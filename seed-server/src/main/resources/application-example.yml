# 配置示例：复制为项目根目录 config/application-local.yml 后按环境修改，该文件不会提交到 Git
# IDEA 可通过 SPRING_PROFILES_ACTIVE=local 或 Active profiles=local 启用

server:
  port: 8080

spring:
  application:
    name: seed-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:seed_admin}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: ${DB_USER:seed_admin}
    password: ${DB_PASSWORD:}
    hikari:
      max-pool-size: 6
      min-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 10s
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

logging:
  level:
    io.github.yak33: debug
